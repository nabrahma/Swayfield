name: Feature request
description: Suggest an idea or improvement for Swayfield.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell me what problem you are trying to solve first, then how you imagine it working.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think Swayfield could help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you tried other workarounds or ideas?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scattering
        - Painting & masks
        - Wind
        - Effectors
        - Materials
        - Performance
        - UI
        - Presets
        - Docs
    validations:
      required: true
