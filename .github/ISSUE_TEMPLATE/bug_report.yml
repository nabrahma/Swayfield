name: Bug report
description: Something in Swayfield is not working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: input
    id: blender-version
    attributes:
      label: Blender version
      placeholder: "e.g. 4.5.15"
    validations:
      required: true
  - type: input
    id: swayfield-version
    attributes:
      label: Swayfield version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11, macOS 14, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: render-engine
    attributes:
      label: Render engine
      options:
        - Cycles
        - EEVEE
        - Workbench/viewport
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the attached file
        2. Select the grass object
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: >
        Drag and drop a .blend file or a screenshot into this box.
        If the .blend file is large or private, a minimal example or a screenshot is fine.
    validations:
      required: false
