name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.8.6"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==${RUFF_VERSION}"
      - run: ruff check .

  test:
    name: test (Blender ${{ matrix.blender }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.5"
            full: "4.5.15"
            series: "Blender4.5"
          - blender: "5.2"
            full: "5.2.3"
            series: "Blender5.2"
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender/blender-${{ matrix.full }}-linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-${{ matrix.full }}-linux-x64
      - name: Install runtime libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libx11-6 libxext6 libxcb1 libdecor-0-0
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .blender
          curl -fsSL "https://download.blender.org/release/${{ matrix.series }}/blender-${{ matrix.full }}-linux-x64.tar.xz" \
            | tar -xJ -C .blender
      - name: Run tests
        run: >
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1
          --python tools/run_tests.py -- -q

  validate:
    runs-on: ubuntu-latest
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender/blender-5.2.3-linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .blender
          key: blender-5.2.3-linux-x64
      - name: Install runtime libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libx11-6 libxext6 libxcb1 libdecor-0-0
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .blender
          curl -fsSL "https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz" \
            | tar -xJ -C .blender
      - name: Validate extension
        run: '"$BLENDER_DIR/blender" --command extension validate swayfield'
      - name: Build extension
        run: python3 tools/build.py --blender "$BLENDER_DIR/blender"
      - uses: actions/upload-artifact@v4
        with:
          name: swayfield-extension
          path: dist/*.zip
          if-no-files-found: error
